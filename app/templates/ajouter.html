{% extends "base.html" %}
{% block content %}
<h2>Ajouter un incident</h2>
{% if erreur %}<p class="erreur">{{ erreur }}</p>{% endif %}
<form method="post">
  <label>Titre <input type="text" name="titre" required></label>
  <label>Description <textarea name="description" rows="4" required></textarea></label>
  <label>Lieu (salle / laboratoire) <input type="text" name="lieu" required></label>
  <label>Priorité
    <select name="priorite">
      {% for p in priorites %}
      <option value="{{ p }}" {% if p == 'moyenne' %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Enregistrer</button>
</form>
{% endblock %}
