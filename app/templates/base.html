<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion des incidents</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 15px; }
    nav a { margin-right: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    label { display: block; margin-top: 10px; }
    input, textarea, select { width: 100%; padding: 6px; }
    button { margin-top: 12px; padding: 8px 14px; cursor: pointer; }
    .erreur { color: #b00020; }
  </style>
</head>
<body>
  <h1>Gestion des incidents informatiques</h1>
  <nav>
    <a href="{{ url_for('index') }}">Liste des incidents</a>
    <a href="{{ url_for('ajouter') }}">Nouvel incident</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
