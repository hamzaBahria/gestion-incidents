{% extends "base.html" %}
{% block content %}
<h2>Incident n°{{ incident.id }} : {{ incident.titre }}</h2>
<p><strong>Description :</strong> {{ incident.description }}</p>
<p><strong>Lieu :</strong> {{ incident.lieu }}</p>
<p><strong>Priorité :</strong> {{ incident.priorite }}</p>
<p><strong>Statut :</strong> {{ incident.statut }}</p>

<form method="post" action="{{ url_for('modifier_statut', incident_id=incident.id) }}">
  <label>Changer le statut
    <select name="statut">
      {% for s in statuts %}
      <option value="{{ s }}" {% if s == incident.statut %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Mettre à jour</button>
</form>

<form method="post" action="{{ url_for('supprimer', incident_id=incident.id) }}"
      onsubmit="return confirm('Supprimer cet incident ?');">
  <button type="submit">Supprimer</button>
</form>
{% endblock %}
